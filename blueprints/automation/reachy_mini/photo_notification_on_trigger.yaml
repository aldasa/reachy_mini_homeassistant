blueprint:
  name: "Reachy Mini: Photo notification on trigger"
  description: >
    When a chosen entity transitions to a target state — a doorbell
    button, a motion sensor, a door contact — take a snapshot through
    the Reachy Mini's camera and send it as a picture notification to
    your phone. See what the robot sees, the moment something happens.


    The camera only streams while the robot is awake; a condition
    silently skips the run when it isn't. Pair with the
    "Wake up on arrival or presence" blueprint if you want the robot
    to wake automatically on the same trigger.


    The snapshot is written under `/config/www/` so the mobile app can
    fetch it via the `/local/` URL. Create the `www` folder once if
    your installation doesn't have it yet.


    **Showcases** the camera entity created by the Reachy Mini Home
    Assistant integration (MJPEG live view + stills over the robot's
    WebRTC stream).
  domain: automation
  author: Pollen Robotics
  source_url: https://github.com/pollen-robotics/reachy_mini_homeassistant/blob/main/blueprints/automation/reachy_mini/photo_notification_on_trigger.yaml
  input:
    trigger_entity:
      name: "Trigger entity"
      description: >
        The entity whose state change takes the photo. Typical picks:
        a doorbell event entity, a motion binary_sensor, a door sensor.
      selector:
        entity: {}
    trigger_state:
      name: "Target state"
      description: >
        Take the photo when the trigger entity transitions *to* this
        state. Common values: `on` (binary_sensor), `home` (person).
      default: "on"
      selector:
        text: {}
    camera_entity:
      name: "Reachy Mini camera"
      selector:
        entity:
          filter:
            - integration: reachy_mini
              domain: camera
    notify_service:
      name: "Notification service"
      description: >
        The notify service for your phone, e.g.
        `notify.mobile_app_your_phone`.
      default: notify.notify
      selector:
        text: {}
    notification_title:
      name: "Notification title"
      default: "Reachy Mini"
      selector:
        text: {}
    notification_message:
      name: "Notification message"
      default: "Something happened — here's what Reachy sees."
      selector:
        text: {}
    snapshot_filename:
      name: "Snapshot file path"
      description: >
        Where the JPEG is written on the HA host. Keep it under
        `/config/www/` so the matching `/local/` URL below resolves.
      default: /config/www/reachy_mini_snapshot.jpg
      selector:
        text: {}
    snapshot_local_url:
      name: "Snapshot local URL"
      description: >
        The `/local/` URL matching the file path above — this is what
        the notification embeds as the picture.
      default: /local/reachy_mini_snapshot.jpg
      selector:
        text: {}

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input trigger_entity
    to: !input trigger_state

condition:
  # The camera exists only while the robot is awake — skip quietly
  # instead of erroring when it's asleep.
  - condition: template
    value_template: >
      {{ states(camera) not in ['unavailable', 'unknown'] }}

variables:
  camera: !input camera_entity
  local_url: !input snapshot_local_url

action:
  - service: camera.snapshot
    target:
      entity_id: !input camera_entity
    data:
      filename: !input snapshot_filename
  - service: !input notify_service
    data:
      title: !input notification_title
      message: !input notification_message
      data:
        # Cache-busting query so the mobile app fetches the fresh frame
        # instead of a previously cached snapshot at the same URL.
        image: "{{ local_url }}?{{ now().timestamp() | int }}"
